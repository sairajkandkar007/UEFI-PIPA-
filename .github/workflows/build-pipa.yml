name: Build pipa UEFI

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to build (owner/name)"
        default: "Project-Silicium/Mu-Silicium"
      ref:
        description: "Branch, tag or commit"
        default: "main"
      build_type:
        description: "RELEASE or DEBUG (DEBUG prints more logs)"
        default: "DEBUG"
        type: choice
        options: [DEBUG, RELEASE]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm acpica-tools \
            python3 python3-pip python3-venv gcc-aarch64-linux-gnu \
            git device-tree-compiler clang lld llvm
          # BootShim build needs an unversioned llvm-objcopy
          if ! command -v llvm-objcopy >/dev/null; then
            sudo ln -sf "$(ls /usr/bin/llvm-objcopy-* | sort -V | tail -1)" /usr/local/bin/llvm-objcopy
          fi
          llvm-objcopy --version | head -1
          if [ -f pip-requirements.txt ]; then
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -r pip-requirements.txt
          fi
          if [ -f build_setup.sh ]; then
            chmod +x build_setup.sh
            . .venv/bin/activate 2>/dev/null || true
            ./build_setup.sh || true
          fi

      - name: Show build script options
        run: |
          . .venv/bin/activate 2>/dev/null || true
          python3 build_uefi.py -h || true
          ls Platforms/Xiaomi 2>/dev/null || true

      - name: Build pipa only
        run: |
          . .venv/bin/activate 2>/dev/null || true
          set -o pipefail
          python3 build_uefi.py -d pipa -r ${{ inputs.build_type }} 2>&1 | tee build.log

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          find . -path ./out -prune -o \( -name "pipa*.img" -o -name "*pipa*.fd" \) -print \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipa-uefi-${{ inputs.build_type }}
          path: out/
          if-no-files-found: warn
