name: Build Xiaomi Pad 6 Secure Boot UEFI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: UEFI build configuration
        required: true
        type: choice
        options:
          - RELEASE
          - DEBUG
        default: RELEASE
      secure_boot:
        description: Enable the Project Silicium Secure Boot configuration
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pipa-secureboot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pipa:
    name: Build pipa (Snapdragon 870)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          chmod +x setup_env.sh build_uefi.py
          ./setup_env.sh -p apt

      - name: Build Xiaomi Pad 6 UEFI
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          SECURE_BOOT: ${{ inputs.secure_boot }}
        run: |
          set -euo pipefail
          args=(-d pipa -r "$BUILD_TYPE" -c)
          if [[ "$SECURE_BOOT" == "true" ]]; then
            args+=(-s)
          fi
          python3 build_uefi.py "${args[@]}"

      - name: Verify output exists
        run: |
          set -euo pipefail
          test -s Mu-pipa.img
          ls -lh Mu-pipa.img

      - name: Upload Xiaomi Pad 6 UEFI image
        uses: actions/upload-artifact@v7
        with:
          name: pipa-uefi-${{ inputs.build_type }}-${{ inputs.secure_boot == true && 'secureboot' || 'no-secureboot' }}
          path: Mu-pipa.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
